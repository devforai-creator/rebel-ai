name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      db: ${{ steps.filter.outputs.db }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect DB-related changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            db:
              - 'supabase/migrations/**'
              - 'supabase/schema.sql'
              - 'src/lib/rls/**'
              - 'scripts/build-hosted-schema.sh'
              - 'package.json'
              - 'package-lock.json'
              - 'docs/DB_CHANGE_WORKFLOW.md'
              - '.github/workflows/test.yml'

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check direct dependency declarations
        run: npm run check:dependencies

      - name: Check browser Supabase client runtime allowlist
        run: npm run check:browser-supabase-client

      - name: Check hosted schema snapshot
        run: npm run db:schema:check

      - name: Check for dependency vulnerabilities (production only)
        run: npm audit --audit-level=high --omit=dev

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run typecheck
        run: npm run typecheck

      - name: Run runtime boundary verification suite
        run: npm run test:runtime-boundaries

      - name: Run unit and integration tests with coverage
        shell: bash
        run: |
          set -o pipefail
          npm run test -- --coverage 2>&1 | tee coverage-output.txt

      - name: Add coverage to summary
        if: always()
        run: |
          echo "## 📊 Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          # Extract coverage summary (All files line with headers)
          grep -E "(^File|^All files|^-+\|)" coverage-output.txt | head -4 >> $GITHUB_STEP_SUMMARY || echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Build for production
        run: npm run build

      - name: Scan for leaked secrets in build output
        run: |
          echo "🔍 Scanning build artifacts for leaked secrets..."

          # Check for service role key patterns in static files
          if grep -r "SUPABASE_SERVICE_ROLE" .next/static/ 2>/dev/null; then
            echo "❌ SECURITY ERROR: Service role key found in static bundle!"
            echo "This indicates the /api/chat route may be using Edge runtime."
            exit 1
          fi

          # Check for other sensitive patterns
          if grep -rE "(eyJ[a-zA-Z0-9_-]{20,}\.eyJ[a-zA-Z0-9_-]{20,})" .next/static/ 2>/dev/null | grep -v "node_modules"; then
            echo "⚠️  WARNING: JWT-like pattern found in static bundle"
            echo "Please verify this is not a real secret"
          fi

          echo "✅ No secrets found in bundle"

  # Validate Supabase migrations and RLS policies
  migrations:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.72.7

      - name: Start Supabase local instance
        run: supabase start

      - name: Apply all migrations
        run: |
          echo "🔄 Applying migrations to local Supabase..."
          supabase db push --local
          echo "✅ All migrations applied successfully"

      - name: Verify migrations can be reapplied from scratch
        run: |
          echo "🔄 Testing full reset (drop + reapply all migrations)..."
          supabase db reset --local --no-seed
          echo "✅ All migrations reapplied successfully"

      - name: Check hosted schema snapshot
        run: npm run db:schema:check

      - name: Run DB integration tests
        run: npm run test:db

      - name: Stop Supabase
        if: always()
        run: supabase stop
