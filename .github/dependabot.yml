version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '09:00'
      timezone: 'Asia/Seoul'
    groups:
      safe-ugc-ui:
        applies-to: 'version-updates'
        patterns:
          - '@safe-ugc-ui/*'
      npm-patch-updates:
        applies-to: 'version-updates'
        patterns:
          - '*'
        exclude-patterns:
          - '@safe-ugc-ui/*'
        update-types:
          - 'patch'
    open-pull-requests-limit: 5

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:15'
      timezone: 'Asia/Seoul'
    open-pull-requests-limit: 2
